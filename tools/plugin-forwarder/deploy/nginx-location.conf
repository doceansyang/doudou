# JinyuTV 插件中转服务 —— nginx 片段
#
# 用法：粘进目标站点的 server{} 里（放在 Nuxt / 其它 location 之前也可以，`^~` 会优先命中）。
# 生产环境请套 HTTPS（站点已有证书即可，不用另签）。
#
# ⚠️ 必须用 `^~`：Nuxt 站点通常有一条兜底 location，普通前缀匹配会被它抢走，
#    表现为 /v1/plugin/getPlugin 返回站点首页 HTML。

location ^~ /v1/plugin/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host   $host;   # 服务靠它拼下载地址（也可用 PUBLIC_BASE_URL 写死）
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP          $remote_addr;

    # 插件包是流式回传的，开缓冲会先把整个文件攒在内存/磁盘里再发
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # 列表接口只有很小的 JSON；下载是 GET，不经过这里的大 body
    client_max_body_size 1m;
}
