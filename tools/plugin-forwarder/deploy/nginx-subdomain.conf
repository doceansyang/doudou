# JinyuTV 插件中转服务 —— 独立子域（推荐方案）
#
# 用法：把 __DOMAIN__ 全部替换成你的子域（如 plugin.linke.link），
#      放到 /etc/nginx/sites-available/__DOMAIN__.conf，ln -s 到 sites-enabled/。
#
# 独立子域的好处：整块 server{} 都是我们的，不存在被主站路由抢走的问题
#（实测 linke.link 的 Nuxt 会把 /v1/plugin/* 302 跳 /home，靠 location ^~ 抢虽然可行但更脆）。
#
# 证书：DNS 生效后 `certbot --nginx -d __DOMAIN__`，certbot 会自己补下面那三行 ssl 配置。

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # 只放行插件接口，其余一律 404 —— 不给这个子域留任何别的用途
    location / {
        return 404;
    }

    location ^~ /v1/plugin/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP          $remote_addr;

        # 插件包是流式回传的，开缓冲会把整个文件先攒在内存/磁盘里
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        client_max_body_size 1m;
    }

    # 下面三行由 certbot 自动写入（ssl 配置），无需手填
    # listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
}
